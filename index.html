<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>柱的信念｜投影端</title>

<style>
  :root{ --red:#d22e2e; --ink:#ececec; }

  html,body{
    height:100%; margin:0;
    background:#000;
    font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  }

  /* === ★ 無限城多層視差背景 + 無慘氣息 + 透視漂浮 ★ === */
  .stage{
    position:relative; height:100svh; width:100%;
    display:grid; place-items:center; overflow:hidden;
    background:#000;
    isolation:isolate;
    perspective:1000px;
  }

  /* 三層視差（同一張圖套不同深度、亮度、移動幅度） */
  .bg-layer{
    position:absolute; inset:-4%;
    background:
      linear-gradient(rgba(40,0,40,.35), rgba(0,0,0,.75)),
      url('infinite_castle.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    transform-origin:center;
    will-change:transform, filter, opacity;
    z-index:-5;
  }
  .bg-back{
    filter:brightness(.72) saturate(1.05) blur(2px);
    transform: translateZ(-260px) scale(1.45);
    animation: floatBack 18s ease-in-out infinite alternate;
    opacity:.9;
  }
  .bg-mid{
    filter:brightness(.88) saturate(1.18);
    transform: translateZ(-140px) scale(1.25);
    animation: floatMid 14s ease-in-out infinite alternate;
    opacity:.95;
  }
  .bg-front{
    filter:brightness(1.12) saturate(1.55);
    transform: translateZ(-60px) scale(1.12);
    animation: floatFront 10s ease-in-out infinite alternate;
    opacity:1;
    mix-blend-mode:screen;
  }

  @keyframes floatBack{
    0%{ transform:translateZ(-260px) translateY(0px) scale(1.45); }
    100%{ transform:translateZ(-260px) translateY(-26px) scale(1.48); }
  }
  @keyframes floatMid{
    0%{ transform:translateZ(-140px) translateY(0px) scale(1.25); }
    100%{ transform:translateZ(-140px) translateY(-18px) scale(1.28); }
  }
  @keyframes floatFront{
    0%{ transform:translateZ(-60px) translateY(0px) scale(1.12); }
    100%{ transform:translateZ(-60px) translateY(-10px) scale(1.15); }
  }

  /* 無慘紫紅氣息 */
  .aura{
    position:absolute; inset:0; pointer-events:none; z-index:-2;
    background:
      radial-gradient(circle at 50% 38%, rgba(255,60,180,.38), transparent 60%),
      radial-gradient(circle at 72% 20%, rgba(180,70,255,.30), transparent 72%),
      radial-gradient(circle at 25% 80%, rgba(120,0,140,.25), transparent 70%);
    mix-blend-mode:screen;
    animation:auraPulse 6s ease-in-out infinite;
  }
  @keyframes auraPulse{
    0%{ opacity:.26; }
    50%{ opacity:.55; }
    100%{ opacity:.26; }
  }

  /* 答對瞬間：背景閃脈衝 */
  .stage.pulse .bg-layer{
    animation-play-state:paused;
    filter:brightness(1.15) saturate(1.6) !important;
  }
  .stage.pulse .aura{ opacity:.9 !important; }
  .pulse-flash{
    position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(circle at 50% 50%, rgba(255,90,210,.85), transparent 55%);
    opacity:0;
  }
  .stage.pulse .pulse-flash{ animation:pulseFlash .55s ease-out; }
  @keyframes pulseFlash{
    0%{ opacity:0; transform:scale(.9); }
    35%{ opacity:.75; transform:scale(1.02); }
    100%{ opacity:0; transform:scale(1.12); }
  }

  /* 空間震動 */
  .stage.shake-soft{ animation: shakeSoft .35s ease-in-out; }
  .stage.shake-hard{ animation: shakeHard .55s ease-in-out; }
  @keyframes shakeSoft{
    0%{ transform:translate(0,0); }
    20%{ transform:translate(-2px,1px); }
    40%{ transform:translate(2px,-1px); }
    60%{ transform:translate(-2px,-1px); }
    80%{ transform:translate(2px,1px); }
    100%{ transform:translate(0,0); }
  }
  @keyframes shakeHard{
    0%{ transform:translate(0,0); }
    10%{ transform:translate(-6px,3px); }
    20%{ transform:translate(6px,-4px); }
    30%{ transform:translate(-5px,-3px); }
    40%{ transform:translate(5px,4px); }
    50%{ transform:translate(-4px,2px); }
    60%{ transform:translate(4px,-3px); }
    70%{ transform:translate(-3px,-2px); }
    80%{ transform:translate(3px,2px); }
    90%{ transform:translate(-2px,1px); }
    100%{ transform:translate(0,0); }
  }

  /* 空間扭曲波紋 */
  .ripple{
    position:absolute; inset:-10%;
    background:
      radial-gradient(closest-side, rgba(255,120,220,.18), transparent 60%) 10% 10%/18% 18%,
      radial-gradient(closest-side, rgba(150,80,255,.16), transparent 65%) 70% 30%/22% 22%,
      radial-gradient(closest-side, rgba(255,40,160,.14), transparent 65%) 40% 80%/26% 26%;
    mix-blend-mode:screen;
    opacity:0; pointer-events:none; z-index:-1;
  }
  .stage.ripple-on .ripple{ animation:rippleMove 1.1s ease-out; }
  @keyframes rippleMove{
    0%{ opacity:0; transform:translateY(8px) scale(.98); filter:blur(14px); }
    35%{ opacity:.55; transform:translateY(-6px) scale(1.02); filter:blur(6px); }
    100%{ opacity:0; transform:translateY(-16px) scale(1.06); filter:blur(18px); }
  }

  /* 鏡像地板反射 */
  .floor-reflect{
    position:absolute; left:0; right:0; bottom:-8%; height:45%;
    background:linear-gradient(to bottom, rgba(180,70,255,.20), rgba(0,0,0,.90));
    filter:blur(14px);
    transform:scaleY(-1);
    opacity:.22;
    pointer-events:none;
    z-index:-1;
  }

  /* ============================
     ★ 內容舞台（現在靠 PNG 當真卷軸）
     ============================ */
  .scroll{
    width:min(1180px,88vw);
    aspect-ratio:21/13.6;
    position:relative;
    overflow:visible; /* 讓 PNG 外框可超出 */
    background:transparent; /* 不再用方框擋背景 */
    border-radius:20px;
    z-index:2;
  }

  /* 真卷軸 PNG 覆蓋 */
  .scroll-overlay{
    position:absolute;
    inset:-6% -5%;      /* 讓外框稍超出舞台 */
    width:110%;
    height:112%;
    object-fit:contain;
    pointer-events:none;
    z-index:0;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.65));
  }

  /* 內層鬼滅微紅煙霧（在內容後、PNG 前） */
  .inner-haze{
    position:absolute; inset:-8%;
    background:
      radial-gradient(700px 320px at 20% 10%, rgba(210,46,46,.12), transparent 60%),
      radial-gradient(900px 380px at 80% 20%, rgba(210,46,46,.10), transparent 60%),
      radial-gradient(1200px 520px at 50% 60%, rgba(210,46,46,.08), transparent 65%);
    mix-blend-mode:screen;
    pointer-events:none;
    z-index:1;
  }

  .title{
    position:absolute; top:.9rem; left:0; right:0;
    text-align:center; color:var(--red);
    font-weight:800; letter-spacing:.06em;
    font-size:clamp(22px,3.2vw,36px);
    text-shadow:0 0 12px rgba(210,46,46,.35);
    z-index:6;
  }

  .toolbar{
    position:absolute; top:.6rem; left:.8rem;
    display:flex; gap:.5rem; z-index:7;
  }
  .btn{
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.22);
    color:#eee; padding:.45rem .7rem;
    border-radius:10px; cursor:pointer;
    font-size:13px;
  }
  .btn:hover{ background:rgba(255,255,255,.16); }

  .timer{
    position:absolute; top:.8rem; right:.9rem;
    z-index:7; color:#fff; font-weight:900;
    letter-spacing:.06em;
    background:rgba(0,0,0,.35);
    padding:.4rem .7rem;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    font-size:clamp(18px,3vw,24px);
    box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .timer.ending{ color:#ffe37a; box-shadow:0 0 24px rgba(255,191,0,.35); }
  .timer.over{ color:#ff9b9b; }

  .pillar-sigil{
    position:absolute; inset:0;
    display:grid; place-items:center;
    pointer-events:none;
    opacity:0; transform:scale(1.4);
    transition:opacity .35s ease, transform .35s ease;
    z-index:5;
  }
  .pillar-sigil.active{ opacity:.6; transform:scale(1); }

  .grid{
    position:absolute; inset:0;
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:clamp(10px,1.6vw,18px);
    padding:clamp(14px,2vw,22px);
    align-content:center;
    z-index:3;
  }
  .chip{
    background:rgba(0,0,0,.35); /* 更透明 */
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    padding:clamp(10px,1.4vw,16px) clamp(12px,1.6vw,18px);
    color:var(--ink);
    font-weight:700; letter-spacing:.08em;
    display:flex; align-items:center; justify-content:center;
    min-height:60px; text-align:center;
    opacity:0; transform:scale(.9);
    transition:opacity .4s ease, transform .4s ease;
    backdrop-filter: blur(2px);
  }
  .chip.show{ opacity:1; transform:scale(1); }

  .particle{
    position:absolute; width:12px; height:12px;
    border-radius:50%; opacity:0; z-index:8;
  }
  @keyframes particle-move{
    0%{ transform:translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; }
  }

  .qr-panel{
    position:fixed; bottom:24px; right:24px;
    z-index:999; display:flex; align-items:flex-end; gap:12px;
    transform:scale(1.2); transform-origin:bottom right;
  }
  .qr-box{
    background:rgba(0,0,0,.75);
    border-radius:14px; padding:10px;
    border:1px solid rgba(255,255,255,.25);
    text-align:center; color:#eee; font-size:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.6);
  }
  .qr-box img{ display:block; width:120px; height:120px; background:#222; border-radius:10px; }
  .qr-box span{ display:block; margin-top:6px; letter-spacing:.12em; }

  .music-btn{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.35);
    color:#ffe9e9; padding:10px 12px;
    border-radius:12px; font-size:12px; cursor:pointer;
    backdrop-filter:blur(4px);
    box-shadow:0 8px 18px rgba(0,0,0,.6);
    white-space:nowrap;
  }
  .music-btn:hover{ background:rgba(255,255,255,.20); }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="bg-layer bg-back"></div>
  <div class="bg-layer bg-mid"></div>
  <div class="bg-layer bg-front"></div>
  <div class="aura"></div>
  <div class="pulse-flash"></div>
  <div class="ripple"></div>
  <div class="floor-reflect"></div>

  <div class="scroll" id="scroll">
    <div class="inner-haze"></div>

    <!-- 真卷軸 PNG 疊加 -->
    <img class="scroll-overlay" src="scroll_overlay.png" alt="卷軸框">

    <div class="toolbar">
      <button class="btn" id="btnReset">⟲ 重設倒數</button>
      <button class="btn" id="btnClear">🧹 清空畫面</button>
    </div>

    <div class="timer" id="timer">05:00</div>
    <div class="title">柱的信念</div>

    <div class="pillar-sigil" id="pillarSigil">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="sigilGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="30" stroke="#f5f5f5" stroke-width="2" fill="none" opacity=".85"/>
        <circle cx="50" cy="50" r="24" fill="url(#sigilGlow)" opacity=".6"/>
        <path id="sigilCore"
              d="M50 22c8 12 3 18-4 26-7 8-8 14 0 22 10-6 18-17 18-27S54 23 50 22z"
              fill="#ffffff" opacity=".9"/>
      </svg>
    </div>

    <div class="grid" id="grid"></div>

    <div id="status"
         style="position:absolute;bottom:10px;left:14px;
                font-size:12px;color:#ddd;opacity:.9; z-index:6;">
      自動連線中（JSONP 模式）…
    </div>
  </div>
</div>

<div class="qr-panel">
  <button class="music-btn" id="musicBtn">🎵 開啟背景音樂</button>
  <div class="qr-box">
    <img id="qrImg" alt="作答入口 QR Code">
    <span>掃碼作答</span>
  </div>
</div>

<script>
// =========================
//  設定區
// =========================
const SHEET_ID   = '14raGqgoJXiFhPgj6IWMlsJPqsLquCMZK5nq62B6rcm0';
const SHEET_NAME = 'Form Responses 1';
const POLL_MS    = 3000;
const ROUND_SEC  = 5 * 60;

const STUDENT_URL = "https://wasabi-610.github.io/kny-form/";
const YOUTUBE_URL = "https://youtu.be/wBXrNikQAI8";

const ANSWER_THEME_MAP = new Map([
  ['THE FLAME OF GUARDIANCE',          'flame'],
  ['WATER BREATH KEEPS CALM',          'water'],
  ['INSECT BREATH FIGHTS WITH SMILE',  'insect'],
  ['FIGHT WITH FLASH',                 'thunder'],
  ['FOCUS BREATH SEES ALL',            'stone'],
  ['WIND BREATH STANDS STRONG',        'wind'],
  ['SNAKE BREATH BINDS TRUST',         'snake'],
  ['LOVE BREATH STRENGTHENS HEART',    'love'],
  ['FAITH BREATH PROTECTS ALL',        'faith']
]);

const TEAM_HEADERS = ['Team', '隊名', '小隊', '組別', '柱別'];
const ANS_HEADERS  = ['Answer', '作答', '答案', '回覆', '內容'];

const $  = s => document.querySelector(s);
const grid       = $('#grid');
const statusEl   = $('#status');
const timerEl    = $('#timer');
const scrollEl   = $('#scroll');
const pillarNode = $('#pillarSigil');
const pillarCore = $('#sigilCore');
const stageEl    = $('#stage');

function normalize(s){
  return (s || '').toString().trim().toUpperCase().replace(/\s+/g,' ');
}
const ACCEPT = new Set(Array.from(ANSWER_THEME_MAP.keys()).map(normalize));
const seen = new Set();

// =========================
//   倒數計時
// =========================
let remainSec   = ROUND_SEC;
let timerHandle = null;
let pollingStop = false;

function formatTime(sec){
  const m = String(Math.floor(sec/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return `${m}:${s}`;
}
function renderTimer(){
  timerEl.textContent = formatTime(remainSec);
  if (remainSec<=15 && remainSec>0) timerEl.classList.add('ending');
  else timerEl.classList.remove('ending');

  if (remainSec<=0){
    clearInterval(timerHandle);
    timerHandle=null;
    timerEl.classList.add('over');
    timerEl.textContent='00:00';
    statusEl.textContent='時間到 · 回合結束';
    pollingStop=true;
  }
}
function startTimer(){
  clearInterval(timerHandle);
  remainSec=ROUND_SEC; pollingStop=false;
  timerEl.classList.remove('over');
  renderTimer();
  timerHandle=setInterval(()=>{ remainSec--; renderTimer(); },1000);
}

$('#btnReset').addEventListener('click', startTimer);
$('#btnClear').addEventListener('click', ()=>{
  grid.innerHTML=''; seen.clear();
});

// =========================
//   場景 FX：脈衝、震動、扭曲
// =========================
function stagePulseAndShake(){
  stageEl.classList.add('pulse');

  stageEl.classList.add('shake-soft');
  setTimeout(()=> {
    stageEl.classList.remove('shake-soft');
    stageEl.classList.add('shake-hard');
  }, 120);

  stageEl.classList.add('ripple-on');

  setTimeout(()=> stageEl.classList.remove('shake-hard'), 620);
  setTimeout(()=> stageEl.classList.remove('ripple-on'), 1200);
  setTimeout(()=> stageEl.classList.remove('pulse'), 520);
}

// =========================
//   柱之特效
// =========================
function colorForTheme(theme){
  switch(theme){
    case 'flame':   return 'rgba(255,120,40,.95)';
    case 'water':   return 'rgba(80,170,255,.95)';
    case 'insect':  return 'rgba(210,140,255,.95)';
    case 'thunder': return 'rgba(255,244,120,.95)';
    case 'stone':   return 'rgba(210,210,210,.95)';
    case 'wind':    return 'rgba(120,255,170,.95)';
    case 'snake':   return 'rgba(160,255,240,.95)';
    case 'love':    return 'rgba(255,160,190,.95)';
    case 'faith':   return 'rgba(255,220,160,.95)';
    default:        return 'rgba(255,120,40,.95)';
  }
}
function pillarFlash(theme){
  const color=colorForTheme(theme);
  pillarCore.setAttribute('fill','#ffffff');
  pillarCore.setAttribute('opacity','0.95');
  pillarNode.style.filter=`drop-shadow(0 0 30px ${color})`;
  pillarNode.classList.add('active');
  setTimeout(()=>pillarNode.classList.remove('active'),700);
}
function spawnParticles(theme){
  const color=colorForTheme(theme);
  const count=40;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.background=color;
    const angle=Math.random()*Math.PI*2;
    const dist=180+Math.random()*220;
    const dx=Math.cos(angle)*dist;
    const dy=Math.sin(angle)*dist;
    p.style.left='50%'; p.style.top='50%';
    p.style.setProperty('--dx',dx+'px');
    p.style.setProperty('--dy',dy+'px');
    p.style.animation='particle-move 0.9s ease-out forwards';
    scrollEl.appendChild(p);
    setTimeout(()=>p.remove(),950);
  }
}
function pillarFX(theme){
  pillarFlash(theme);
  spawnParticles(theme);
  stagePulseAndShake();
}

// =========================
//   JSONP 抓取試算表資料
// =========================
let pollTimer=null, lastScript=null;

function scheduleNext(){
  clearTimeout(pollTimer);
  pollTimer=setTimeout(jsonpLoad,POLL_MS);
}
function jsonpLoad(){
  if(pollingStop) return;
  if(lastScript && lastScript.parentNode){
    lastScript.parentNode.removeChild(lastScript);
  }
  const url=
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`+
    `?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`+
    `&reqId=${Date.now()}`;
  const s=document.createElement('script');
  s.src=url; s.async=true;
  lastScript=s; document.body.appendChild(s);
}

window.google=window.google||{};
google.visualization=google.visualization||{};
google.visualization.Query=google.visualization.Query||{};
google.visualization.Query.setResponse=function(payload){
  try{
    if(!payload || payload.status!=='ok'){
      statusEl.textContent='讀取失敗（payload）';
      return scheduleNext();
    }
    const table=payload.table;
    const cols=table.cols.map(c=>(c.label||'').trim());
    const rows=table.rows||[];

    let teamIdx=cols.findIndex(h=>TEAM_HEADERS.includes(h));
    let ansIdx=cols.findIndex(h=>ANS_HEADERS.includes(h));
    if(teamIdx===-1 || ansIdx===-1){
      statusEl.textContent='找不到隊名或答案欄位（Team/隊名 & Answer/答案）';
      return scheduleNext();
    }

    let newCount=0;
    rows.forEach(r=>{
      const c=r.c||[];
      const team=(c[teamIdx] && c[teamIdx].v) || '未命名隊伍';
      const ans =(c[ansIdx]  && c[ansIdx].v ) || '';
      const norm=normalize(ans);
      const key =`${team}||${norm}`;

      if(!seen.has(key) && ACCEPT.has(norm)){
        seen.add(key); newCount++;

        const chip=document.createElement('div');
        chip.className='chip';
        chip.textContent=`${team}：${ans}`;
        grid.prepend(chip);
        requestAnimationFrame(()=>chip.classList.add('show'));

        const theme=ANSWER_THEME_MAP.get(norm)||'flame';
        pillarFX(theme);
      }
    });

    statusEl.textContent=`已連線 • 新增 ${newCount} 答對`;
  }catch(e){
    statusEl.textContent='解析失敗';
  }finally{
    scheduleNext();
  }
};

// =========================
//   QR Code 與音樂按鈕
// =========================
const qrImg=document.getElementById('qrImg');
const musicBtn=document.getElementById('musicBtn');

if(qrImg){
  const target=STUDENT_URL && STUDENT_URL.trim() ? STUDENT_URL.trim() : "https://example.com";
  const qrApi="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(target);
  qrImg.src=qrApi;
  qrImg.onerror=()=>{
    qrImg.style.display="none";
    const parent=qrImg.parentElement;
    if(parent){
      parent.innerHTML='<div style="padding:8px;color:#ffb3b3;font-size:11px;">QR 載入失敗<br>請檢查網路或網址</div>';
    }
  };
}
if(musicBtn && YOUTUBE_URL){
  musicBtn.addEventListener('click', ()=>window.open(YOUTUBE_URL,'_blank'));
}

// 啟動
startTimer();
statusEl.textContent='自動連線中（JSONP 模式）…';
jsonpLoad();
</script>
</body>
</html>
